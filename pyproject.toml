[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lockprofile"
version = "0.1.1"
description = "Find pylock entry-selection changes across every declared feature subset"
requires-python = ">=3.11"
dependencies = ["packaging==26.3"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.scripts]
lockprofile = "lockprofile.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
